name: ci
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
jobs:
  test-provisioning:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        test-case: [roles, groups, licenses, account_groups, actions]
    env:
      BATON_LOG_LEVEL: debug
      CONNECTOR_PRINCIPAL: "${{ secrets.CONNECTOR_PRINCIPAL }}"
      BATON_COUPA_CLIENT_ID: "${{ secrets.BATON_COUPA_CLIENT_ID }}"
      BATON_COUPA_CLIENT_SECRET: "${{ secrets.BATON_COUPA_CLIENT_SECRET }}"
      BATON_COUPA_DOMAIN: "${{ secrets.BATON_COUPA_DOMAIN }}"
      BATON_STATUS_TEST_USER_ID: "${{ secrets.BATON_STATUS_TEST_USER_ID }}"
      BATON_ACCOUNT_GROUP_TEST_ID: "${{ secrets.BATON_ACCOUNT_GROUP_TEST_ID }}"
      BATON_CONNECTOR: ./baton-coupa
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install baton
        run: ./scripts/get-baton.sh && mv baton /usr/local/bin
      - name: Build baton-coupa
        run: go build ./cmd/baton-coupa
      - name: Run tests for ${{ matrix.test-case }}
        if: matrix.test-case != 'actions'
        run: |
          case "${{ matrix.test-case }}" in
            "roles")
              ./scripts/validate-grant.sh ${{ env.CONNECTOR_PRINCIPAL }} user role:4:member role:4:member:user:${{ env.CONNECTOR_PRINCIPAL }}
              ;;
            "groups")
              ./scripts/validate-grant.sh ${{ env.CONNECTOR_PRINCIPAL }} user group:2:member group:2:member:user:${{ env.CONNECTOR_PRINCIPAL }}
              ;;
            "licenses")
              ./scripts/validate-grant.sh ${{ env.CONNECTOR_PRINCIPAL }} user license:treasury_user:assigned license:treasury_user:assigned:user:${{ env.CONNECTOR_PRINCIPAL }}
              ;;
            "account_groups")
              ./scripts/validate-grant.sh ${{ env.CONNECTOR_PRINCIPAL }} user account_group:${{ env.BATON_ACCOUNT_GROUP_TEST_ID }}:member account_group:${{ env.BATON_ACCOUNT_GROUP_TEST_ID }}:member:user:${{ env.CONNECTOR_PRINCIPAL }}
              ;;
          esac
      - name: Test Account Status Changes
        if: matrix.test-case == 'actions'
        # TODO: Replace with the official action when it's published
        uses: ConductorOne/github-workflows/actions/account-status-lifecycle-test@v3
        with:
          connector: './baton-coupa'
          account-id: '${{ env.BATON_STATUS_TEST_USER_ID }}'
          enable-action-name: 'enable_user'
          disable-action-name: 'disable_user'
          id-parameter-name: 'user_id'
